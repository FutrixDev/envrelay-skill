# One crate, one binary. The empty `[workspace]` table makes that explicit so
# the package is never absorbed into an enclosing workspace.
[workspace]

[package]
name = "envrelay"
version = "1.0.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT OR Apache-2.0"
description = "Encrypt and decrypt an EnvRelay development-environment backup with a user passphrase."
publish = false

[dependencies]
age = "0.11"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
tar = "0.4"
zstd = "0.13"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
